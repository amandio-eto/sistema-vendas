<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Casino Spin Wheel FULL PRO</title>

<style>
body {
    background: #0f172a;
    color: white;
    font-family: Arial;
    text-align: center;
    margin: 0;
    overflow-x: hidden;
}

/* TITLE */
h1 {
    margin-top: 20px;
    font-size: 40px;
}

/* CENTER FIX */
.wheel-container {
    position: relative;
    width: 650px;
    height: 650px;
    margin: 40px auto;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* POINTER */
.pointer {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 25px solid transparent;
    border-right: 25px solid transparent;
    border-bottom: 45px solid white;
    z-index: 10;
}

/* WHEEL WRAPPER */
.wheel-wrapper {
    width: 600px;
    height: 600px;
    position: relative;
    border-radius: 50%;

    will-change: transform;
    transform: translateZ(0);

    transition: transform 23s cubic-bezier(0.12, 0.85, 0.15, 1);
}

/* WHEEL */
.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 14px solid white;

    background: conic-gradient(
        #22c55e 0deg 45deg,
        #facc15 45deg 90deg,
        #ef4444 90deg 135deg,
        #3b82f6 135deg 180deg,
        #a855f7 180deg 225deg,
        #f97316 225deg 270deg,
        #14b8a6 270deg 315deg,
        #e11d48 315deg 360deg
    );
}

/* LABEL */
.label span {
    position: absolute;
    left: 50%;
    top: 50%;
    font-size: 22px;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 6px rgba(0,0,0,0.7);
}

/* BUTTON */
button {
    margin-top: 25px;
    padding: 22px 100px;
    font-size: 30px;
    font-weight: bold;
    border: none;
    background: linear-gradient(45deg, #22c55e, #16a34a);
    color: white;
    border-radius: 18px;
    cursor: pointer;
}

/* RESULT */
.result {
    margin-top: 25px;
    font-size: 36px;
    font-weight: bold;
}
</style>
</head>

<body>

<h1>🎡 CASINO SPIN WHEEL FULL PRO 🔊</h1>

<div class="wheel-container">
    <div class="pointer"></div>

    <div class="wheel-wrapper" id="wheelWrapper">
        <div class="wheel"></div>
        <div class="label" id="labels"></div>
    </div>
</div>

<button onclick="spin()">SPIN NOW 🚀</button>

<div class="result" id="result">Click SPIN</div>

<!-- 🔊 SPIN SOUND -->
<audio id="spinSound" loop preload="auto">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_d0b4e9c6b1.mp3">
</audio>

<!-- 🔊 CLICK SOUND (roulette ball) -->
<audio id="clickSound">
  <source src="https://www.soundjay.com/button/sounds/button-16.mp3">
</audio>

<script>
let wheelWrapper = document.getElementById("wheelWrapper");
let spinSound = document.getElementById("spinSound");
let clickSound = document.getElementById("clickSound");

let rewards = ["$10","$20","$30","$40","$50","$60","$70","$100"];

let labels = document.getElementById("labels");

/* LABELS */
rewards.forEach((text, i) => {
    let angle = (360 / rewards.length) * i;

    let span = document.createElement("span");
    span.innerHTML = text;

    span.style.transform = `
        rotate(${angle + 22.5}deg)
        translate(260px)
    `;

    labels.appendChild(span);
});

let rotation = 0;

/* AUDIO UNLOCK */
document.addEventListener("click", () => {
    spinSound.play().then(() => {
        spinSound.pause();
        spinSound.currentTime = 0;
    }).catch(()=>{});
}, { once: true });

function playClick() {
    clickSound.currentTime = 0;
    clickSound.play();
}

function spin() {

    // 🔊 START SPIN SOUND
    spinSound.currentTime = 0;
    spinSound.play();

    // 🎡 ROTATE (23 sec feel)
    let random = Math.floor(Math.random() * 360) + 9000;
    rotation += random;

    wheelWrapper.style.transform = `translateZ(0) rotate(${rotation}deg)`;

    // 🎯 CLICK ROULETTE EFFECT
    let duration = 23000;
    let start = Date.now();

    let interval = setInterval(() => {
        let elapsed = Date.now() - start;

        if (elapsed >= duration) {
            clearInterval(interval);
            return;
        }

        let speed = 1 - (elapsed / duration);

        if (Math.random() < speed * 0.7) {
            playClick();
        }

    }, 110);

    // ⏱ STOP
    setTimeout(() => {

        spinSound.pause();

        let normalized = rotation % 360;
        let index = Math.floor((normalized / 360) * rewards.length);

        document.getElementById("result").innerText =
            "🎉 YOU WIN: " + rewards[index];

    }, 23000);
}
</script>

</body>
</html>
