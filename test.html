<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inbox WhatsApp</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
}
.container {
    display: flex;
    height: 90vh;
}
.inbox {
    width: 30%;
    background: #fff;
    border-right: 1px solid #ddd;
}
.inbox-item {
    padding: 15px;
    border-bottom: 1px solid #eee;
    cursor: pointer;
}
.inbox-item:hover {
    background: #f1f1f1;
}
.chat {
    width: 70%;
    display: flex;
    flex-direction: column;
}
.chat-header {
    padding: 15px;
    background: #25D366;
    color: white;
}
.chat-body {
    flex: 1;
    padding: 20px;
    background: #e5ddd5;
}
.message {
    background: #fff;
    padding: 10px;
    margin-bottom: 10px;
    border-radius: 5px;
    max-width: 60%;
}
.chat-footer {
    padding: 15px;
    background: #fff;
    border-top: 1px solid #ddd;
}
.btn-wa {
    display: inline-block;
    padding: 10px 15px;
    background: #25D366;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}
</style>
</head>
<body>

<h2>Inbox</h2>

<div class="container">
    <!-- INBOX LIST -->
    <div class="inbox">
        <div class="inbox-item">
            <strong>Client</strong><br>
            77027766
        </div>
    </div>

    <!-- CHAT PANEL -->
    <div class="chat">
        <div class="chat-header">
            Client - 77027766
        </div>

        <div class="chat-body">
            <div class="message">
                Halo admin, saya mau tanya transaksi
            </div>
        </div>

        <div class="chat-footer">
            <a class="btn-wa"
               href="https://wa.me/67077027766?text=Halo%20kami%20dari%20Sistema%20Vendas"
               target="_blank">
               Balas via WhatsApp
            </a>
        </div>
    </div>
</div>

</body>
</html>
