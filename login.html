<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Image Slider</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Poppins', sans-serif; }

/* CONTAINER */
.container {
    display:flex;
    height:100vh;
}

/* LEFT IMAGE SLIDER */
.left {
    flex:1;
    position:relative;
    overflow:hidden;
}

.slide {
    position:absolute;
    width:100%;
    height:100%;
    background-size:cover;
    background-position:center;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    color:white;
    opacity:0;
    transition:0.6s;
}

/* overlay gelap biar text kebaca */
.slide::after {
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    top:0;
    left:0;
}

.slide-content {
    position:relative;
    z-index:2;
    text-align:center;
}

.slide.active {
    opacity:1;
}

.slide h2 {
    font-size:32px;
    margin-bottom:10px;
}

/* DOTS */
.dots {
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
}

.dots span {
    width:10px;
    height:10px;
    background:white;
    margin:5px;
    display:inline-block;
    border-radius:50%;
    opacity:0.5;
    cursor:pointer;
}

.dots span.active {
    opacity:1;
}

/* RIGHT LOGIN */
.right {
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f5f7fb;
    padding:20px;
}

.card {
    width:100%;
    max-width:500px;
    background:white;
    padding:50px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,0.12);
}

.card h2 {
    font-size:30px;
    margin-bottom:10px;
}

.card p {
    margin-bottom:25px;
    color:#666;
}

/* INPUT */
input {
    width:100%;
    padding:15px;
    margin:10px 0;
    border-radius:10px;
    border:1px solid #ddd;
}

input:focus {
    border-color:#4f46e5;
}

/* BUTTON */
button {
    width:100%;
    padding:15px;
    background:#4f46e5;
    color:white;
    border:none;
    border-radius:10px;
    font-weight:600;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:768px){
    .container {
        flex-direction:column;
    }

    .left {
        height:35%;
    }

    .right {
        height:65%;
    }

    .card {
        padding:30px;
    }
}
</style>
</head>

<body>

<div class="container">

    <!-- SLIDER -->
    <div class="left">

        <div class="slide active" style="background-image:url('https://picsum.photos/id/1015/1200/800')">
            <div class="slide-content">
                <h2>Welcome</h2>
                <p>Modern System</p>
            </div>
        </div>

      <div class="slide active" style="background-image:url('{{ asset('images/slide1.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide2.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide3.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide4.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide5.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide6.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide7.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide8.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide9.jpg') }}')"></div>
        <div class="slide" style="background-image:url('{{ asset('images/slide10.jpg') }}')"></div>
    <div class="dots"></div>
    </div>

    <!-- LOGIN -->
    <div class="right">
        <div class="card">
            <h2>Welcome Back</h2>
            <p>Login to your account</p>

            <input type="email" placeholder="Email">
            <input type="password" placeholder="Password">

            <button>Sign In</button>

            <div style="text-align:center;margin-top:15px;">
                Forgot password?
            </div>
        </div>
    </div>

</div>

<script>
let slides = document.querySelectorAll('.slide');
let dotsContainer = document.querySelector('.dots');
let index = 0;

/* dots */
slides.forEach((_, i) => {
    let dot = document.createElement('span');
    dot.onclick = () => showSlide(i);
    dotsContainer.appendChild(dot);
});

let dots = document.querySelectorAll('.dots span');

function showSlide(i){
    slides.forEach(s => s.classList.remove('active'));
    dots.forEach(d => d.classList.remove('active'));

    slides[i].classList.add('active');
    dots[i].classList.add('active');
    index = i;
}

function autoSlide(){
    index = (index + 1) % slides.length;
    showSlide(index);
}

showSlide(0);
setInterval(autoSlide, 4000);
</script>

</body>
</html>
